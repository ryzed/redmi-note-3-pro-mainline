# /etc/kenzo-battery.conf — charge limit for kenzo-batteryd.
# The phone stays on a wall charger. At STOP_THRESHOLD charging is paused: the phone runs from the charger and the
# battery rests. At START_THRESHOLD charging resumes. The daemon re-reads this file on every check, no restart needed.

STOP_THRESHOLD=80
START_THRESHOLD=70
CHECK_INTERVAL_SEC=30
