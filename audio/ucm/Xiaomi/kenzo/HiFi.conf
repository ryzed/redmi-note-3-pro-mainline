# kenzo HiFi: MultiMedia1 (hw:N,0) -> SLIMBUS_0_RX -> WCD9335 AIF1_PB (SLIM RX0 + RX1),
# MultiMedia2 (hw:N,1) <- SLIMBUS_0_TX <- AIF1_CAP (SLIM TX0).
#
# Both RX ports stay on AIF1_PB for every playback device, so switching between the speaker and the
# headphones changes only the paths inside the codec, never the set of SLIMbus channels of a running
# stream. The speaker and the headphones conflict on purpose: they become two card profiles, and a
# profile switch reopens the stream - switching the codec path under an open stream overflows the
# SLIMbus RX port and the output stays silent. The headset jack ("Headset Jack", WCD9335 MBHC,
# kernel r16+) marks the headphones available; the WirePlumber hook kenzo/jack-profile.lua then picks
# the profile.
# Volume is software (PipeWire); the codec gains below are the fixed maximum.

SectionVerb {
	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
		cset "name='RX INT5_1 MIX1 INP0' ZERO"
		cset "name='RX INT6_1 MIX1 INP0' ZERO"
		cset "name='RX INT6_1 MIX1 INP1' ZERO"
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		cset "name='RX INT6_2 MUX' ZERO"
		cset "name='Speaker Switch' 0"
	]

	DisableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
	]

	Value {
		TQ "HiFi"
	}
}

# Speaker: mono, external amplifier on LINEOUT4 (GPIO101). Left (RX0) on the RX6 mix path, right (RX1)
# on the RX6 primary path, each at -6 dB so their sum does not clip.
SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='RX INT6_2 MUX' RX0"
		cset "name='RX INT6_1 MIX1 INP0' RX1"
		cset "name='COMP6 Switch' 1"
		cset "name='RX6 Mix Digital Volume' 78"
		cset "name='RX6 Digital Volume' 78"
		cset "name='LINEOUT4 Volume' 13"
		cset "name='Speaker Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='RX INT6_2 MUX' ZERO"
		cset "name='RX INT6_1 MIX1 INP0' ZERO"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

# Headphones (3.5 mm): as the "headphones" path of the stock kenzo mixer_paths - RX0 -> RX INT1_2 ->
# HPHL, RX1 -> RX INT2_2 -> HPHR, class-H DEM. Digital gain capped at -12 dB to spare the ears.
SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX1 Mix Digital Volume' 72"
		cset "name='RX2 Mix Digital Volume' 72"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
		cset "name='RX INT1_2 MUX' RX0"
		cset "name='RX INT2_2 MUX' RX1"
	]

	DisableSequence [
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headset Jack"
	}
}

# Phone microphone: AMIC1 -> ADC1 -> DEC0 -> SLIM TX0.
SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='AMIC MUX0' ADC1"
		cset "name='ADC MUX0' AMIC"
		cset "name='ADC1 Volume' 10"
		cset "name='SLIM TX0 MUX' DEC0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
	]

	DisableSequence [
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='SLIM TX0 MUX' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
