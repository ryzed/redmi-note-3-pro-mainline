# kenzo (Xiaomi Redmi Note 3 Pro): встроенная карта apq8096 "xiaomi-kenzo" (тикеты 26b09-37, 26b09-39, 26b10-01).
# 1) Громкость и «без звука» — программные (api.alsa.soft-mixer): своего регулятора на пути динамика в UCM нет,
#    а найденный PipeWire «аппаратный» на звук не влиял — ползунок системы ничего не делал (09.11).
# 2) Гнездо наушников выбирает профиль карты (динамик / наушники) — хук kenzo-jack-profile.lua.
# Формат S16LE больше не задаём: с ядра r16 драйвер не предлагает S24_LE, в котором звук был на ~48 дБ тише
# (24 бита в младших разрядах, DSP ждёт их в старших; 26b09-40).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-sound*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]

wireplumber.components = [
  {
    name = kenzo-jack-profile.lua, type = script/lua
    provides = custom.kenzo-jack-profile
  }
]

wireplumber.profiles = {
  main = {
    custom.kenzo-jack-profile = required
  }
}
